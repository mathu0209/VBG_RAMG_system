server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: mgnregs-smart-system
  datasource:
    # Uses H2 in-memory DB by default with MySQL compatibility mode for instant execution, 
    # but seamlessly switches to MySQL 8.0 when configured.
    url: jdbc:h2:mem:mgnregsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: 9a2f8c4e7b1d3a5f8c6e4b2d0a8f6c4e7b1d3a5f8c6e4b2d0a8f6c4e7b1d3a5f
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
